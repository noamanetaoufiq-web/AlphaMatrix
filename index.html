<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlphaMatrix Enterprise | Seasonal Ranked Console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#04060a;--card:rgba(13,19,30,.72);--card2:rgba(8,12,20,.88);--border:rgba(0,243,255,.16);--cyan:#00F3FF;--emerald:#00FF9D;--magenta:#FF0055;--gold:#FFD700;--red:#ff4d4d;--orange:#ff9d2e;--violet:#b07aff;--text:#E6ECF3;--muted:#6b7890;--gc:0 0 10px rgba(0,243,255,.5);--ge:0 0 10px rgba(0,255,157,.5);--gm:0 0 10px rgba(255,0,85,.5);--gg:0 0 10px rgba(255,215,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.amb-grid,.amb-glow,.amb-scan{position:fixed;inset:0;pointer-events:none;z-index:0}
.amb-grid{background-image:linear-gradient(rgba(0,243,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,.045) 1px,transparent 1px);background-size:46px 46px;animation:gridDrift 22s linear infinite;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 90%);mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 90%)}
@keyframes gridDrift{from{background-position:0 0}to{background-position:46px 46px}}
.amb-glow{background:radial-gradient(40% 40% at 18% 22%,rgba(0,243,255,.12),transparent 70%),radial-gradient(38% 38% at 82% 78%,rgba(0,255,157,.10),transparent 70%),radial-gradient(30% 30% at 70% 12%,rgba(255,0,85,.07),transparent 70%);animation:glowBreath 9s ease-in-out infinite alternate}
@keyframes glowBreath{from{opacity:.55;transform:scale(1)}to{opacity:1;transform:scale(1.08)}}
.amb-scan{background:repeating-linear-gradient(rgba(0,243,255,.022) 0 2px,transparent 2px 4px);mix-blend-mode:overlay;opacity:.5}
.top-bar{position:fixed;top:0;left:0;right:0;height:62px;background:rgba(4,6,10,.82);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 22px;z-index:100;backdrop-filter:blur(14px)}
.sidebar{width:244px;height:100vh;position:fixed;left:0;top:62px;background:rgba(7,10,16,.9);border-right:1px solid var(--border);padding:20px 14px;overflow-y:auto;z-index:10;backdrop-filter:blur(8px)}
.sidebar::-webkit-scrollbar{width:6px}.sidebar::-webkit-scrollbar-thumb{background:linear-gradient(var(--cyan),var(--emerald));border-radius:3px}
.main{margin-left:244px;margin-top:62px;padding:30px;position:relative;z-index:1;min-height:calc(100vh - 62px)}
.glass{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.3,1),border-color .35s,box-shadow .35s;backdrop-filter:blur(8px)}
.glass::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);transition:left .7s;pointer-events:none}
.glass:hover{transform:translateY(-4px);border-color:rgba(0,243,255,.4);box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 22px rgba(0,243,255,.12)}
.glass:hover::after{left:130%}
@keyframes revealUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:18px}.grid-4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.grid-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.grid-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
h2{font-family:'Orbitron',sans-serif;color:var(--cyan);margin-bottom:8px;letter-spacing:1.5px;font-size:1.7rem;text-shadow:var(--gc);font-weight:800}
h2 .sub{display:block;font-family:'Rajdhani';font-size:.85rem;color:var(--muted);letter-spacing:2px;text-shadow:none;text-transform:uppercase;margin-top:4px;font-weight:500}
h3{font-family:'Orbitron',sans-serif;color:#fff;margin-bottom:14px;font-size:1.05rem;letter-spacing:1px}
.stat{font-family:'Orbitron',sans-serif;font-size:1.9rem;font-weight:800;margin:8px 0;letter-spacing:.5px}
.stat-huge{font-size:3rem;text-align:center;margin:18px 0}
.cyan{color:var(--cyan);text-shadow:var(--gc)}.emerald{color:var(--emerald);text-shadow:var(--ge)}.magenta{color:var(--magenta);text-shadow:var(--gm)}.gold{color:var(--gold);text-shadow:var(--gg)}.violet{color:var(--violet)}.red{color:var(--red)}.orange{color:var(--orange)}
.muted{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:1.2px}
.logo{text-align:center;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.logo i{font-size:2.1rem;color:var(--cyan);text-shadow:var(--gc);display:inline-block;animation:logoSpin 8s linear infinite}
@keyframes logoSpin{0%,100%{transform:rotateY(0)}50%{transform:rotateY(360deg)}}
.logo h3{margin-top:10px;font-size:1.15rem}.logo span{color:var(--cyan)}
.nav-item{padding:11px 12px;margin-bottom:7px;border-radius:9px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:12px;transition:.25s;font-weight:600;font-size:.95rem;position:relative}
.nav-item i{width:20px;text-align:center}.nav-item:hover{background:rgba(0,243,255,.08);color:var(--cyan);transform:translateX(4px)}
.nav-item.active{background:linear-gradient(90deg,rgba(0,243,255,.18),transparent);color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan)}
.form-control{width:100%;background:rgba(0,0,0,.5);border:1px solid var(--border);color:#fff;padding:11px 12px;border-radius:7px;margin-bottom:13px;font-family:'Rajdhani';font-size:1rem;transition:.25s}
.form-control:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(0,243,255,.12)}
textarea.form-control{min-height:74px;resize:vertical}select.form-control{cursor:pointer}
.btn{padding:11px 18px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);font-family:'Orbitron';cursor:pointer;border-radius:7px;font-weight:700;letter-spacing:1px;transition:.25s;width:100%;text-transform:uppercase;font-size:.82rem;position:relative;overflow:hidden}
.btn::before{content:"";position:absolute;inset:0;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s;z-index:-1}
.btn:hover{color:#04060a;box-shadow:var(--gc)}.btn:hover::before{transform:scaleX(1)}
.btn-emerald{border-color:var(--emerald);color:var(--emerald)}.btn-emerald:hover{box-shadow:var(--ge)}
.btn-magenta{border-color:var(--magenta);color:var(--magenta)}.btn-magenta:hover{color:#fff;box-shadow:var(--gm)}
.btn-gold{border-color:var(--gold);color:var(--gold)}.btn-gold:hover{box-shadow:var(--gg)}
.btn:disabled{opacity:.3;cursor:not-allowed}.btn:disabled:hover::before{transform:scaleX(0)}
.btn-sm{padding:8px 14px;font-size:.72rem;width:auto}
.badge{padding:6px 12px;border-radius:20px;font-size:.72rem;font-family:'Orbitron';border:1px solid;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.badge-m{border-color:var(--magenta);color:var(--magenta);background:rgba(255,0,85,.1)}.badge-e{border-color:var(--emerald);color:var(--emerald);background:rgba(0,255,157,.1)}.badge-g{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.1)}
.badge-r{border-color:var(--red);color:var(--red);background:rgba(255,77,77,.12);animation:alertPulse 1.4s infinite}
@keyframes alertPulse{0%,100%{box-shadow:0 0 0 rgba(255,77,77,0)}50%{box-shadow:0 0 14px rgba(255,77,77,.6)}}
.level-master{background:linear-gradient(135deg,rgba(0,243,255,.07),rgba(0,255,157,.05));border:1px solid rgba(0,243,255,.35)}
.progress-bar{height:22px;background:#000;border-radius:11px;border:1px solid var(--cyan);overflow:hidden;position:relative;margin:14px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--emerald));transition:width 1s ease;box-shadow:0 0 14px var(--cyan);position:relative}
.progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:sheen 2.4s infinite}
@keyframes sheen{from{transform:translateX(-100%)}to{transform:translateX(200%)}}
.progress-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron';font-size:.82rem;color:#fff;z-index:2;text-shadow:0 1px 3px #000}
.dd-bar{height:10px;background:#000;border-radius:6px;overflow:hidden;border:1px solid rgba(255,77,77,.3);margin-top:8px}
.dd-fill{height:100%;background:linear-gradient(90deg,var(--emerald),var(--gold),var(--red));transition:width .6s}
.timer-display{font-family:'Orbitron';font-size:2.5rem;color:var(--cyan);text-shadow:var(--gc);text-align:center;margin:14px 0;letter-spacing:2px}
.status-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px}
.status-dot.online{background:var(--emerald);box-shadow:0 0 8px var(--emerald);animation:pulse 1.5s infinite}.status-dot.offline{background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.rank-badge-wrap{position:relative;width:104px;height:112px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-badge-wrap svg{width:100%;height:100%;display:block;position:relative;z-index:1;animation:glowPulse 2.6s ease-in-out infinite;filter:drop-shadow(0 0 5px var(--gc2))}
.tier-Bronze{--gc2:#cd7f32}.tier-Silver{--gc2:#c0c0c0}.tier-Gold{--gc2:#ffd24d}.tier-Platinum{--gc2:#b07aff}.tier-Diamond{--gc2:#ff5ad0}.tier-Hero{--gc2:#ff5a3c}.tier-Master{--gc2:#ffd700}.tier-Grandmaster{--gc2:#ff4ad0}
.tier-Hero svg,.tier-Master svg,.tier-Grandmaster svg{animation:glowPulse 2s ease-in-out infinite,floaty 3s ease-in-out infinite}
.tier-Master .rank-badge-wrap::before,.tier-Grandmaster .rank-badge-wrap::before{content:'';position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,transparent,var(--gc2),transparent 55%);animation:spin 4s linear infinite;opacity:.55;z-index:0;filter:blur(2px)}
.tier-Grandmaster .rank-badge-wrap::before{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 4px var(--gc2))}50%{filter:drop-shadow(0 0 18px var(--gc2))}}
@keyframes twinkle{0%,100%{opacity:1;text-shadow:0 0 8px var(--gold)}50%{opacity:.5;text-shadow:0 0 2px var(--gold)}}
@keyframes rankUpFlash{0%{transform:scale(1);filter:brightness(1)}25%{transform:scale(1.35);filter:brightness(2.8) drop-shadow(0 0 30px #fff)}100%{transform:scale(1);filter:brightness(1)}}
.rankup{animation:rankUpFlash 1.3s ease}
.star-row{display:flex;gap:3px;justify-content:center;margin-top:6px}.star-slot{font-size:1.1rem;line-height:1;transition:.3s}
.star-slot.filled{color:var(--gold);animation:twinkle 2.2s infinite}.star-slot.empty{color:#232833}
.rank-name{font-family:'Orbitron';font-weight:700;font-size:.95rem;margin-top:8px;letter-spacing:1px}
.stats-mini{font-size:.8rem;color:var(--muted);margin-top:10px;line-height:1.7}.stats-mini b{color:var(--text);font-family:'Orbitron'}
.rank-table{width:100%;border-collapse:collapse}.rank-table th{text-align:left;padding:13px;color:var(--cyan);border-bottom:2px solid var(--border);font-family:'Orbitron';font-size:.76rem;letter-spacing:1px}
.rank-table td{padding:13px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}.rank-table tr{transition:.2s}.rank-table tr:hover{background:rgba(0,243,255,.06)}
.rank-table .mini-badge{width:52px;height:56px;display:inline-block}.rank-table .mini-badge svg{width:100%;height:100%;display:block}
.season-banner{border-color:var(--violet);box-shadow:0 0 26px rgba(176,122,255,.16)}
.trend-up{color:var(--emerald);text-shadow:var(--ge)}.trend-down{color:var(--magenta);text-shadow:var(--gm)}.trend-flat{color:var(--muted)}
.rank-ctrl{padding:16px;margin-bottom:0;transition:transform .3s,border-color .3s,box-shadow .3s}
.rank-ctrl:hover{border-color:var(--gold);box-shadow:0 0 22px rgba(255,215,0,.18)}
.rc-head{display:flex;align-items:center;gap:14px}
.rc-info{flex:1;min-width:0}
.rc-name{font-family:'Orbitron';font-weight:800;font-size:1.05rem;letter-spacing:.5px}
.rc-rank{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:2px 0 4px}
.ctrl-row{display:flex;gap:6px;margin-top:12px}
.cb{flex:1;padding:10px 4px;border-radius:7px;border:1px solid;font-family:'Orbitron';font-size:.78rem;font-weight:800;cursor:pointer;background:transparent;transition:transform .15s,background .2s,color .2s,box-shadow .2s;position:relative;overflow:hidden}
.cb:hover{transform:translateY(-3px)}.cb:active{transform:scale(.9)}
.cb-plus{border-color:var(--emerald);color:var(--emerald)}.cb-plus:hover{background:var(--emerald);color:#000;box-shadow:var(--ge)}
.cb-minus{border-color:var(--magenta);color:var(--magenta)}.cb-minus:hover{background:var(--magenta);color:#fff;box-shadow:var(--gm)}
.cb-up{border-color:var(--gold);color:var(--gold)}.cb-up:hover{background:var(--gold);color:#000;box-shadow:var(--gg)}
.cb-down{border-color:var(--orange);color:var(--orange)}.cb-down:hover{background:var(--orange);color:#000;box-shadow:0 0 12px var(--orange)}
.cb-reset{border-color:var(--muted);color:var(--muted)}.cb-reset:hover{background:var(--muted);color:#000}
.cal-nav{display:flex;align-items:center;gap:14px;margin:18px 0}.cal-nav .mn{font-family:'Orbitron';font-size:1.3rem;min-width:230px;text-align:center;color:var(--cyan);text-shadow:var(--gc)}
.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-bottom:22px}
.hm-cell{aspect-ratio:1.4;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Orbitron';font-size:.62rem;cursor:pointer;border:1px solid var(--border);transition:.2s}
.hm-cell:hover{transform:scale(1.08);border-color:var(--cyan)}.hm-cell .hm-m{opacity:.7}.hm-cell .hm-v{font-size:.78rem;font-weight:700}
.days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.day-label{text-align:center;font-family:'Orbitron';font-size:.66rem;font-weight:800;padding:4px 0}.day-label.weekday{color:var(--cyan)}.day-label.weekend{color:var(--magenta)}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{aspect-ratio:1;background:#0c1018;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid #1b2230;transition:.2s;padding:2px;position:relative}
.day.empty{background:transparent;border:none;cursor:default;pointer-events:none}
.day:not(.empty):hover{border-color:var(--cyan);transform:scale(1.1);z-index:5;box-shadow:0 0 12px var(--cyan)}
.day-num{font-family:'Orbitron';font-size:.85rem}.day-amt{font-size:.6rem;font-family:'Orbitron';margin-top:1px;font-weight:700}
.day.win{background:var(--emerald);color:#000;border-color:var(--emerald)}.day.loss{background:var(--magenta);color:#fff;border-color:var(--magenta)}.day.be{background:var(--muted);color:#000;border-color:var(--muted)}
.day.today{outline:2px solid var(--gold);outline-offset:1px;box-shadow:0 0 12px var(--gold)}.day.hasnews::after{content:"📰";position:absolute;top:1px;right:2px;font-size:.5rem}
table{width:100%;border-collapse:collapse}th{text-align:left;padding:11px;color:var(--cyan);border-bottom:1px solid var(--border);font-family:'Orbitron';font-size:.76rem}td{padding:11px;border-bottom:1px solid rgba(255,255,255,.05)}
.strike-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.strike-btn{flex:1;min-width:44px;padding:10px 4px;font-family:'Orbitron';font-size:.78rem;border:1px solid #333;background:transparent;color:#666;border-radius:5px;cursor:pointer;transition:.2s}
.strike-btn:hover:not(:disabled){border-color:var(--magenta);color:var(--magenta)}
.strike-btn.active{background:var(--magenta);border-color:var(--magenta);color:#fff;box-shadow:var(--gm)}
.abs-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}.abs-btn.active{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:var(--gg)}
.strike-btn:disabled{opacity:.3;cursor:not-allowed}
.pagination-row{display:flex;gap:10px;margin-top:14px;align-items:center}
.page-btn{flex:1;padding:8px;background:rgba(0,243,255,.08);border:1px solid var(--cyan);color:var(--cyan);border-radius:5px;cursor:pointer;font-family:'Orbitron';font-size:.72rem;transition:.2s}
.page-btn:hover:not(:disabled){background:var(--cyan);color:#000}.page-btn:disabled{opacity:.3;cursor:not-allowed}
.page-indicator{font-family:'Orbitron';font-size:.78rem;color:var(--gold);text-align:center;flex:1}
.wallet-display{text-align:center;padding:50px 20px}.wallet-icon{font-size:5rem;color:var(--gold);text-shadow:var(--gg);margin-bottom:24px;animation:floaty 4s ease-in-out infinite}.wallet-amount{font-size:4rem;font-family:'Orbitron';font-weight:900;color:var(--gold);margin:18px 0}
.chart-container{position:relative;height:380px;margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(2,4,8,.92);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-box{background:var(--card2);border:1px solid var(--cyan);padding:28px;border-radius:14px;width:92%;max-width:460px;text-align:center;box-shadow:0 0 40px rgba(0,243,255,.2)}
.news-tag{display:inline-block;padding:3px 9px;background:rgba(255,77,77,.15);color:var(--red);border:1px solid var(--red);border-radius:4px;font-size:.72rem;font-family:'Orbitron';margin:2px}
.sess{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}.sess .dot{width:9px;height:9px;border-radius:50%}
.eco-hi{background:rgba(255,77,77,.08);border:1px solid var(--red);border-radius:10px;padding:14px;margin-bottom:16px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:'Orbitron';font-size:.72rem}
.toggle .sw{width:38px;height:20px;border-radius:11px;background:#222;position:relative;transition:.3s;border:1px solid var(--border)}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.3s}
.toggle.on .sw{background:rgba(0,255,157,.25);border-color:var(--emerald)}.toggle.on .sw::after{left:20px;background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
.err-pre{white-space:pre-wrap;color:var(--muted);font-size:.78rem;font-family:monospace;background:rgba(0,0,0,.4);padding:12px;border-radius:8px;margin:12px 0;text-align:left;max-height:200px;overflow:auto}
@media print{.amb-grid,.amb-glow,.amb-scan,.top-bar,.sidebar,.modal,.no-print{display:none!important}.main{margin:0;padding:10px}.glass{box-shadow:none;border:1px solid #ccc;break-inside:avoid}body{background:#fff;color:#000}.cyan,.emerald,.magenta,.gold{color:#000!important;text-shadow:none!important}}
@media(max-width:860px){.sidebar{width:72px}.sidebar span,.logo h3{display:none}.main{margin-left:72px;padding:16px}.nav-item{justify-content:center}.heatmap{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div class="amb-grid"></div><div class="amb-glow"></div><div class="amb-scan"></div>
<header class="top-bar no-print">
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <span class="badge badge-m" id="mode-badge"><i class="fas fa-eye"></i> VIEWER</span>
    <span class="badge badge-g" id="db-badge"><i class="fas fa-database"></i> SYNCING</span>
    <span class="badge badge-r" id="news-badge" style="display:none"><i class="fas fa-bolt"></i> HIGH IMPACT</span>
    <span class="badge" id="user-badge" style="display:none;border-color:var(--cyan);color:var(--cyan)"><i class="fas fa-user"></i> <span id="user-name-display"></span></span>
  </div>
  <div style="display:flex;gap:9px;align-items:center">
    <div class="toggle on" id="audio-toggle" onclick="toggleAudio()"><span class="sw"></span><i class="fas fa-volume-up"></i></div>
    <button class="btn btn-sm" id="member-login-btn" onclick="openMemberModal()">MEMBER</button>
    <button class="btn btn-sm" onclick="openAdminModal()"><i class="fas fa-lock-open"></i> ADMIN</button>
    <button class="btn btn-sm btn-magenta" id="logout-btn" style="display:none" onclick="safeLogout()">LOGOUT</button>
  </div>

 for(let d=1;d<=dim;d++){const k=fmtKey(YEAR,calMonth,d),l=state.calendar[k],itc=k===tk,hasN=ECO.some(e=>e.date===k&&e.imp==='High');let cls='day';if(itc)cls+=' today';if(hasN)cls+=' hasnews';let c=`<div class="day-num">${d}</div>`;if(l){cls+=l.outcome==='win'?' win':l.outcome==='loss'?' loss':' be';const am=Math.abs(l.amount),dp=am>=1000?(am/1000).toFixed(1)+'k':am;if(l.outcome!=='be')c+=`<div class="day-amt">${l.outcome==='win'?'+':'-'}$${dp}</div>`;else c+=`<div class="day-amt">B/E</div>`;}const dn=dayName(YEAR,calMonth,d),ca=isAdmin?`onclick="openDay('${k}',${d},'${dn}')"`:'';dh+=`<div class="${cls}" ${ca} title="${dn}${hasN?' · 📰 High Impact':''}">${c}</div>`;}
 return `<h2><i class="fas fa-calendar-alt"></i> PERFORMANCE CALENDAR<span class="sub">Yearly heatmap · monthly log · 📰 = high impact news</span></h2>
  <div class="glass"><h3>YEARLY OVERVIEW</h3><div class="heatmap">${hm.map((h,mi)=>{const col=h.c===0?'#0c1018':h.s>=0?'rgba(0,255,157,'+(0.25+Math.min(.6,Math.abs(h.s)/300))+')':'rgba(255,0,85,'+(0.25+Math.min(.6,Math.abs(h.s)/300))+')';return `<div class="hm-cell" style="background:${col}" onclick="calMonth=${mi};renderAll()"><span class="hm-m">${h.mn.slice(0,3)}</span><span class="hm-v" style="color:${h.s>=0?'var(--emerald)':'var(--magenta)'}">${h.c?((h.s>=0?'+':'-')+'$'+Math.abs(h.s).toFixed(0)):'—'}</span></div>`;}).join('')}</div></div>

function renderAnalytics(){let gW=0,gL=0,lk=0,winDays=[],lossDays=[];state.trades.forEach(t=>t.pnl>0?gW+=t.pnl:gL+=Math.abs(t.pnl));state.leaks.forEach(l=>lk+=l.amt);

function fmtDur(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(c).padStart(2,'0')}`;}
function daysInM(y,m){return new Date(y,m+1,0).getDate();}
function firstD(y,m){const d=new Date(y,m,1).getDay();return d===0?6:d-1;}
function fmtKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function dayName(y,m,d){return new Date(y,m,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function animVal(el,to,suf){if(!el)return;const from=parseFloat(el.dataset.v||0);el.dataset.v=to;const dur=600,st=performance.now();const pre=(to<0?'-':'')+(suf==='$'?'$':'');const post=suf==='%'?'%':'';const av=Math.abs(to);function step(t){const p=Math.min(1,(t-st)/dur);const v=from+(av-from)*p;el.textContent=pre+(suf==='$'?v.toFixed(2):v.toFixed(suf==='%'?1:2))+post;if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function renderEquity(){const cv=document.getElementById('equityChart');if(!cv||typeof Chart==='undefined')return;const dd={};Object.keys(state.calendar).forEach(k=>{const l=state.calendar[k];if(l&&l.amount!=null)dd[k]=(dd[k]||0)+parseFloat(l.amount);});state.trades.forEach(t=>{if(!t.date)return;const k=t.date.split('T')[0];dd[k]=(dd[k]||0)+parseFloat(t.pnl);});const sk=Object.keys(dd).sort();const lb=sk.map(k=>new Date(k+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}));const cum=[];let r=150;sk.forEach(k=>{r+=dd[k];cum.push(r);});const dv=Object.values(dd);const bd=dv.length?Math.max(...dv):0,wd=dv.length?Math.min(...dv):0;const winD=dv.filter(v=>v>0),lossD=dv.filter(v=>v<0);const aw=winD.length?winD.reduce((a,b)=>a+b,0)/winD.length:0,al=lossD.length?lossD.reduce((a,b)+a+b,0)/lossD.length:0;const cp=cum.length?cum[cum.length-1]-150:0;
 animVal(document.getElementById('best-day'),bd,'$');animVal(document.getElementById('worst-day'),wd,'$');animVal(document.getElementById('avg-win'),aw,'$');animVal(document.getElementById('avg-loss'),al,'$');
 if(!lb.length){const ctx=cv.getContext('2d');ctx.fillStyle='#6b7890';ctx.font='16px Orbitron';ctx.textAlign='center';ctx.fillText('No data yet — push trades or log days',cv.width/2,180);return;}
 const ctx=cv.getContext('2d'),g=ctx.createLinearGradient(0,0,0,380);if(cp>=0){g.addColorStop(0,'rgba(0,255,157,.4)');g.addColorStop(1,'rgba(0,255,157,0)');}else{g.addColorStop(0,'rgba(255,0,85,.4)');g.addColorStop(1,'rgba(255,0,85,0)');}equityChart=new Chart(ctx,{type:'line',data:{labels:lb,datasets:[{data:cum,borderColor:cp>=0?'#00FF9D':'#FF0055',backgroundColor:g,borderWidth:3,fill:true,tension:.3,pointRadius:4,pointHoverRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(4,6,10,.95)',borderColor:'#00F3FF',borderWidth:1,titleColor:'#00F3FF',bodyColor:'#fff'}},scales:{y:{grid:{color:'rgba(0,243,255,.08)'},ticks:{color:'#6b7890',callback:v=>'$'+v.toFixed(0)}},x:{grid:{display:false},ticks:{color:'#6b7890'}}}}});}
