<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#04060a;--card:rgba(13,19,30,.8);--bd:rgba(111,163,199,.2);--cy:#6FA3C7;--em:#00FF9D;--mg:#FF0055;--gd:#FFD700;--rd:#ff4d4d;--or:#ff9d2e;--vi:#b07aff;--tx:#E6ECF3;--mu:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Manrope;background:var(--bg);color:var(--tx);min-height:100vh}
.tb{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(4,6,10,.9);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;padding:0 20px;z-index:100}
.sb{width:230px;height:100vh;position:fixed;left:0;top:60px;background:rgba(7,10,16,.95);border-right:1px solid var(--bd);padding:16px 12px;overflow-y:auto;z-index:10}
.mn2{margin-left:230px;margin-top:60px;padding:24px}
.g{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
.gr{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
h2{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--cy);margin-bottom:14px;font-size:1.7rem;letter-spacing:.5px}h3{font-family:'Cormorant Garamond',serif;font-weight:700;color:#fff;margin-bottom:12px;font-size:1.25rem}
.st{font-family:Manrope;font-size:1.7rem;font-weight:800;margin:6px 0}.cy{color:var(--cy)}.em{color:var(--em)}.mg{color:var(--mg)}.gd{color:var(--gd)}.rd{color:var(--rd)}.vi{color:var(--vi)}.mu{color:var(--mu);font-size:.8rem;text-transform:uppercase}
.ni{padding:10px;margin-bottom:6px;border-radius:8px;cursor:pointer;color:var(--mu);display:flex;gap:10px;font-weight:600}
.ni:hover{color:var(--cy);background:rgba(111,163,199,.08)}.ni.on{color:var(--cy);background:rgba(111,163,199,.15)}
.fc{width:100%;background:rgba(0,0,0,.5);border:1px solid var(--bd);color:#fff;padding:10px;border-radius:6px;margin-bottom:12px}
textarea.fc{min-height:60px}
.b{padding:10px;border:1px solid var(--cy);background:transparent;color:var(--cy);font-family:Manrope;cursor:pointer;border-radius:6px;font-weight:700;width:100%;text-transform:uppercase;font-size:.8rem}
.be{border-color:var(--em);color:var(--em)}.bm{border-color:var(--mg);color:var(--mg)}.bgd{border-color:var(--gd);color:var(--gd)}
.b:disabled{opacity:.3;cursor:not-allowed}.bs{padding:7px 12px;width:auto;font-size:.7rem}
.bd{padding:5px 10px;border-radius:16px;font-size:.7rem;font-family:Manrope;border:1px solid;display:inline-flex;gap:5px}
.bdm{border-color:var(--mg);color:var(--mg)}.bde{border-color:var(--em);color:var(--em)}.bdg{border-color:var(--gd);color:var(--gd)}.bdv{border-color:var(--vi);color:var(--vi)}.bdr{border-color:var(--rd);color:var(--rd);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,77,77,0)}50%{box-shadow:0 0 14px rgba(255,77,77,.6)}}
.pb{height:20px;background:#000;border-radius:10px;border:1px solid var(--cy);overflow:hidden;position:relative;margin:12px 0}
.pf{height:100%;background:linear-gradient(90deg,var(--cy),var(--em));transition:width 1s}
.pt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Manrope;font-size:.8rem;color:#fff}
.rw{display:inline-flex}.rw svg{width:100%;height:100%}
.sr{display:flex;gap:3px;justify-content:center;margin-top:5px}.ss{font-size:1rem}.ss.f{color:var(--gd)}.ss.e{color:#232833}
table{width:100%;border-collapse:collapse}th{text-align:left;padding:10px;color:var(--cy);border-bottom:1px solid var(--bd);font-family:Manrope;font-size:.72rem}td{padding:10px;border-bottom:1px solid rgba(255,255,255,.05)}
.sb2{flex:1;min-width:42px;padding:9px 3px;font-family:Manrope;font-size:.75rem;border:1px solid #333;background:transparent;color:#666;border-radius:5px;cursor:pointer}
.sb2.on{background:var(--mg);border-color:var(--mg);color:#fff}.ab.on{background:var(--gd);border-color:var(--gd);color:#000}
.pr{display:flex;gap:8px;margin-top:12px}.pb2{flex:1;padding:7px;border:1px solid var(--cy);color:var(--cy);background:rgba(111,163,199,.08);border-radius:5px;cursor:pointer;font-family:Manrope;font-size:.7rem}
.pb2:disabled{opacity:.3}.pi{font-family:Manrope;font-size:.75rem;color:var(--gd);flex:1;text-align:center}
.dh{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}.dl2{text-align:center;font-family:Manrope;font-size:.6rem;font-weight:700}.dl2.w{color:var(--cy)}.dl2.e{color:var(--mg)}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.md{position:fixed;inset:0;background:rgba(2,4,8,.92);display:none;align-items:center;justify-content:center;z-index:1000}
.mb{background:#0a0e16;border:1px solid var(--cy);padding:24px;border-radius:12px;width:92%;max-width:440px}
.cc{position:relative;height:360px}
.del{background:transparent;border:1px solid var(--mg);color:var(--mg);border-radius:5px;cursor:pointer;padding:4px 8px}
#login{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:2000}
#login canvas.bg,#reveal canvas.bg{position:absolute;inset:0;z-index:0}
.lbox{position:relative;z-index:2;width:92%;max-width:380px;background:rgba(10,14,22,.85);border:1px solid var(--bd);border-radius:16px;padding:34px 28px;text-align:center}
.lbox .cube{font-size:3.5rem;color:var(--cy);animation:cubeRot 6s linear infinite}
@keyframes cubeRot{to{transform:rotateY(360deg)}}
.lbox h2{font-family:Manrope;color:var(--cy);margin:14px 0 4px;letter-spacing:2px}
.lbox .tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;color:#C9A961;font-size:.95rem;letter-spacing:1.5px;margin-bottom:26px}
.lbox input{background:rgba(0,0,0,.6);border:1px solid rgba(111,163,199,.3);color:#fff;padding:12px;border-radius:8px;margin-bottom:10px;width:100%}
.lbox input:focus{outline:none;border-color:var(--cy)}
.lbox .b{background:linear-gradient(135deg,var(--cy),var(--em));color:#000;border:none;padding:14px}
#lerr{color:var(--mg);margin-top:10px;font-size:.75rem}
#reveal{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:3000}
#reveal .big{width:260px;height:280px;animation:badgeBoom 1.4s cubic-bezier(.2,.9,.3,1.2) .2s both}
#reveal .big svg{width:100%;height:100%;filter:drop-shadow(0 0 40px var(--rv-color,#fff))}
@keyframes badgeBoom{0%{transform:scale(0) rotate(-540deg);opacity:0}40%{transform:scale(1.4) rotate(20deg);opacity:1}100%{transform:scale(1) rotate(0)}}
#reveal .nm{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:2.3rem;color:#fff;margin-top:24px;letter-spacing:1px;opacity:0;animation:slideUp 1s 1s both}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
#reveal .rk{font-family:'Cormorant Garamond',serif;font-weight:700;font-style:italic;color:var(--rv-color,#6FA3C7);margin-top:8px;opacity:0;animation:slideUp .9s 1.3s both}
#reveal .stars{display:flex;gap:6px;margin-top:12px;opacity:0;animation:slideUp .8s 1.6s both}
#reveal .stars span{color:var(--gd);font-size:1.3rem}
.season-banner{border-color:var(--vi);box-shadow:0 0 26px rgba(176,122,255,.16)}
#toast{position:fixed;bottom:24px;right:24px;z-index:2000;background:linear-gradient(135deg,var(--or),var(--rd));color:#fff;padding:14px 20px;border-radius:10px;font-family:Manrope;font-size:.8rem;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:380px;display:none;cursor:pointer}
.cal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.cal-stat{background:linear-gradient(135deg,rgba(111,163,199,.08),rgba(0,255,157,.03));border:1px solid var(--bd);border-radius:10px;padding:14px;position:relative}
.cal-stat .lb{font-family:Manrope;font-size:.68rem;color:var(--mu);letter-spacing:1.5px}
.cal-stat .vl{font-family:Manrope;font-size:1.5rem;font-weight:800;margin-top:4px}
.cal-stat .ic{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:1.6rem;opacity:.15}
.cal-stat.win .vl{color:var(--em)}.cal-stat.loss .vl{color:var(--mg)}.cal-stat.streak .vl{color:var(--gd)}.cal-stat.net .vl{color:var(--cy)}

.hm-cell{aspect-ratio:1.1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.25s;border:1px solid transparent}
.hm-cell:hover{transform:translateY(-4px);border-color:var(--cy)}
.hm-cell.active{border-color:var(--gd)}
.hm-cell .hm-m{font-family:Manrope;font-size:.62rem;font-weight:700}
.hm-cell .hm-v{font-family:Manrope;font-size:.78rem;font-weight:800;margin-top:2px}
.hm-cell.empty{background:#0a0e16;opacity:.4}
.hm-cell.pos{background:linear-gradient(135deg,rgba(0,255,157,.15),rgba(0,255,157,.35))}
.hm-cell.neg{background:linear-gradient(135deg,rgba(255,0,85,.15),rgba(255,0,85,.35))}
.hm-cell .hm-dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--gd)}
.cal-legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:.72rem;color:var(--mu);flex-wrap:wrap}
.cal-legend .dt{width:12px;height:12px;border-radius:3px;display:inline-block}
.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.month-title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.6rem;color:var(--cy)}
.month-nav .b{width:42px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.day-card{aspect-ratio:1;background:linear-gradient(135deg,#0c1018,#0a0e16);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid #1b2230;transition:.3s;position:relative}
.day-card:not(.empty):hover{border-color:var(--cy);transform:translateY(-3px) scale(1.04)}
.day-card.empty{visibility:hidden}
.day-card .d-num{font-family:Manrope;font-size:.95rem;font-weight:700}
.day-card .d-amt{font-family:Manrope;font-size:.65rem;font-weight:700;margin-top:3px}
.day-card .d-meta{position:absolute;top:3px;right:3px;display:flex;gap:2px;font-size:.55rem;z-index:2}
.day-card.win{background:linear-gradient(135deg,rgba(0,255,157,.25),rgba(0,255,157,.08));border-color:var(--em)}
.day-card.win .d-num,.day-card.win .d-amt{color:var(--em)}
.day-card.loss{background:linear-gradient(135deg,rgba(255,0,85,.25),rgba(255,0,85,.08));border-color:var(--mg)}
.day-card.loss .d-num,.day-card.loss .d-amt{color:var(--mg)}
.day-card.be{background:rgba(107,114,128,.15)}
.day-card.today{outline:2px solid var(--gd);box-shadow:0 0 20px rgba(255,215,0,.4)}
.day-card.future{opacity:.35;pointer-events:none}
.mp-bar{height:26px;background:#000;border-radius:13px;border:1px solid var(--cy);overflow:hidden;position:relative}
.mp-fill{height:100%;background:linear-gradient(90deg,var(--cy),var(--em));transition:width 1s}
.mp-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:Manrope;font-size:.72rem;color:#fff}
.lb-row{opacity:0;transform:translateX(-30px)}.lb-row.in{animation:lbIn .6s both}
@keyframes lbIn{to{opacity:1;transform:none}}
.lb-row.you{background:rgba(111,163,199,.12)!important;border-left:3px solid var(--cy)}
.news-tag{display:inline-block;padding:3px 9px;background:rgba(255,77,77,.15);color:var(--rd);border:1px solid var(--rd);border-radius:4px;font-size:.72rem;font-family:Manrope;margin:2px}
.sess{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}.sess .dot{width:9px;height:9px;border-radius:50%}
.eco-hi{background:rgba(255,77,77,.08);border:1px solid var(--rd);border-radius:10px;padding:14px;margin-bottom:16px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:Manrope;font-size:.72rem}
.toggle .sw{width:38px;height:20px;border-radius:11px;background:#222;position:relative;transition:.3s;border:1px solid var(--bd)}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mu);transition:.3s}
.toggle.on .sw{background:rgba(0,255,157,.25);border-color:var(--em)}.toggle.on .sw::after{left:20px;background:var(--em)}

.lnode.done{background:rgba(201,169,97,.16);border-color:#C9A961;color:#F0D28A}

.lline{flex:0 0 10px;height:2px;background:#232833}
.lline.done{background:#C9A961}
.acct-card{border:1px solid rgba(201,169,97,.18);background:linear-gradient(160deg,rgba(46,84,120,.09),transparent)}
.acct-card.pumped{border-color:rgba(0,255,157,.5);background:linear-gradient(160deg,rgba(0,255,157,.07),transparent)}
.pump-btn{background:linear-gradient(135deg,#F0D28A,#C9A961)!important;border:none!important;color:#1a1408!important;font-weight:800}

function startParticles(canvas,opts){const ctx=canvas.getContext('2d');let w,h,particles=[];function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}resize();window.addEventListener('resize',resize);const count=opts.count||80;const colors=opts.colors||['#C9A961','#6FA3C7','#F0D28A'];for(let i=0;i<count;i++)particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*(opts.speed||.5),vy:(Math.random()-.5)*(opts.speed||.5),r:Math.random()*2+.5,c:colors[Math.floor(Math.random()*colors.length)],a:Math.random()*.5+.3});function loop(){ctx.clearRect(0,0,w,h);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.c;ctx.globalAlpha=p.a;ctx.fill();});requestAnimationFrame(loop);}loop();}

function renderBroadcast(){const tk=todayKey(),tt=state.trades.filter(t=>t.date&&t.date.slice(0,10)===tk);const wa=new Date(Date.now()-7*864e5).toISOString().slice(0,10),wt=state.trades.filter(t=>t.date&&t.date.slice(0,10)>=wa);return '<h2>BROADCAST</h2><div class="gr g2"><div class="g" style="border-color:var(--rd)"><h3 class="mg">📊 DAILY RECAP</h3><div style="background:rgba(0,0,0,.3);padding:14px;border-radius:8px;margin:14px 0"><div style="display:flex;justify-content:space-between"><span class="mu">Today trades</span><strong class="cy">'+tt.length+'</strong></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span class="mu">Last sent</span><strong>'+(state.lastDailySent||'Never')+'</strong></div></div><button class="b bm" onclick="pushDaily()">SEND DAILY</button></div><div class="g" style="border-color:var(--or)"><h3 class="or">🏆 WEEKLY REPORT</h3><div style="background:rgba(0,0,0,.3);padding:14px;border-radius:8px;margin:14px 0"><div style="display:flex;justify-content:space-between"><span class="mu">Week trades</span><strong class="cy">'+wt.length+'</strong></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span class="mu">Last sent</span><strong>'+(state.lastWeeklySent||'Never')+'</strong></div></div><button class="b bgd" onclick="pushWeekly()">SEND WEEKLY</button></div></div><div class="g" style="border-color:var(--rd)"><h3 class="rd">RECOVERY</h3><p class="mu" style="margin-bottom:14px">Wipe local data and reload. Cloud stays safe.</p><button class="b bm" style="max-width:300px" onclick="hardReset()">HARD RESET</button></div>';}
function fmtDur(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(c).padStart(2,'0');}
