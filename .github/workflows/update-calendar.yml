name: Update Market Calendar

"on":
  schedule:
    - cron: '5 * * * *'   # every hour at minute 5 (GitHub may delay this a few minutes under load)
  workflow_dispatch:       # lets you trigger it manually from the Actions tab
    inputs:
      test_alert:
        description: 'Send a test Discord alert (needs DISCORD_NEWS_WEBHOOK secret)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch calendar into news.json
        run: python scripts/fetch_calendar.py

      - name: Fetch market context into context.json
        run: python scripts/fetch_context.py
        continue-on-error: true

      - name: Fetch daily/weekly/monthly bias into bias.json
        run: python scripts/fetch_bias.py
        continue-on-error: true

      - name: Discord alert before high-impact news
        run: python scripts/notify_news.py
        continue-on-error: true
        env:
          DISCORD_NEWS_WEBHOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          NEWS_ALERT_TEST: ${{ inputs.test_alert && '1' || '0' }}

      - name: Commit generated data files if changed
        run: |
          for f in news.json context.json bias.json alerts.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update market data [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes - nothing to commit."
          fi
