name: Update Market Calendar

"on":
  schedule:
    - cron: '5 * * * *'   # every hour at minute 5 (GitHub may delay this a few minutes under load)
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch calendar into news.json
        run: python scripts/fetch_calendar.py

      - name: Fetch market context into context.json
        run: python scripts/fetch_context.py
        continue-on-error: true

      - name: Commit news.json / context.json if changed
        run: |
          git add -A news.json context.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update market data [skip ci]"
            git push
          else
            echo "No changes - nothing to commit."
          fi
