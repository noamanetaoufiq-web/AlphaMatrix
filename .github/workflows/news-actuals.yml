name: News Actuals

"on":
  schedule:
    - cron: '*/5 12-21 * * 1-5'   # every 5 min during the US data hours (GitHub may delay runs a few minutes)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  actuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the real printed values (BLS) into news.json
        run: |
          s=scripts/fetch_actuals.py; [ -f "$s" ] || s=fetch_actuals.py
          python "$s"
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      - name: Commit if changed
        run: |
          for f in news.json actuals.json; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: news actual printed [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No new actual."
          fi
