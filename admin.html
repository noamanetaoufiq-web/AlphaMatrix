<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Eternal Palace 👑</title>
    
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a0a1a 0%, #2d1f3d 50%, #1a0a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .admin-container {
            background: rgba(255, 107, 157, 0.05);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid rgba(255, 182, 193, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
        }
        .admin-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #ffb6c1;
            margin-bottom: 5px;
        }
        .admin-subtitle { color: rgba(255, 255, 255, 0.6); margin-bottom: 25px; font-size: 0.9rem; }
        .admin-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .send-miss-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(135deg, #ff6b9d, #ffb6c1);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.3);
        }
        .status-message { margin-top: 20px; font-size: 0.9rem; color: #ffb6c1; min-height: 20px; }
        .success { color: #4ade80 !important; }
        .login-input {
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px;
            border: 1px solid rgba(255, 182, 193, 0.3); background: rgba(255,255,255,0.08);
            color: white; font-family: 'Poppins', sans-serif; font-size: 1rem;
        }
        .logout-btn { margin-top: 15px; background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 0.8rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-icon">👑</div>
        <h1 class="admin-title">Noamane's Control</h1>
        <p class="admin-subtitle">Eternal Palace Admin</p>
        
        <div id="loginBox">
            <input id="adminEmail" type="email" class="login-input" placeholder="Email" autocomplete="username">
            <input id="adminPassword" type="password" class="login-input" placeholder="Password" autocomplete="current-password">
            <button class="send-miss-btn" onclick="adminLogin()">Login 🔐</button>
        </div>

        <div id="adminPanel" class="hidden">
            <button id="sendMissYouBackBtn" class="send-miss-btn" onclick="sendMissYouBack()">
                Send Miss You Back 💖
            </button>
            <button class="logout-btn" onclick="adminLogout()">Logout</button>
        </div>
        
        <p id="statusMessage" class="status-message"></p>
    </div>

    <script>
        // Firebase console > Project settings > Your apps > Web app > copy the apiKey here
        const firebaseConfig = {
            apiKey: "AIzaSyBHD7JLpAJAruH1eyhLqa6q3RLNzpQcuz4",
            authDomain: "eternal-palace.firebaseapp.com",
            databaseURL: "https://eternal-palace-default-rtdb.firebaseio.com",
            projectId: "eternal-palace",
            storageBucket: "eternal-palace.firebasestorage.app",
            messagingSenderId: "202517421099",
            appId: "1:202517421099:web:8f2fa16a6e0a328be5de6e",
            projectId: "eternal-palace"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        const loginBox = document.getElementById('loginBox');
        const adminPanel = document.getElementById('adminPanel');
        const statusMsg = document.getElementById('statusMessage');

        auth.onAuthStateChanged((user) => {
            loginBox.classList.toggle('hidden', !!user);
            adminPanel.classList.toggle('hidden', !user);
        });

        async function adminLogin() {
            statusMsg.classList.remove('success');
            try {
                await auth.signInWithEmailAndPassword(
                    document.getElementById('adminEmail').value.trim(),
                    document.getElementById('adminPassword').value
                );
                statusMsg.textContent = '';
            } catch (error) {
                statusMsg.textContent = '❌ Email wla password ghalat';
            }
        }

        function adminLogout() { auth.signOut(); }

        async function sendMissYouBack() {
            const btn = document.getElementById('sendMissYouBackBtn');
            btn.disabled = true;
            btn.textContent = 'Sending... 💕';
            try {
                await database.ref('status/noamane_misses').set(true);
                statusMsg.textContent = '💖 Sent to Ilham!';
                statusMsg.classList.add('success');
                setTimeout(async () => {
                    await database.ref('status/noamane_misses').set(false);
                    btn.disabled = false;
                    btn.textContent = 'Send Miss You Back 💖';
                    statusMsg.textContent = '';
                    statusMsg.classList.remove('success');
                }, 4000);
            } catch (error) {
                statusMsg.textContent = '❌ Error! (wach nta connecté?)';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
